<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>Tier List</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #111; color: white; }
    .tier { display: flex; margin-bottom: 10px; }
    .label { width: 150px; padding: 10px; font-weight: bold; text-align: center; }
    .dropzone, .pool { flex: 1; border: 1px solid #444; min-height: 100px; display: flex; gap: 10px; padding: 10px; flex-wrap: wrap; background:#1a1a1a; }

    img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      background: white;
      cursor: grab;
      border: 1px solid #555;
      position: relative;
    }

    .img-wrapper {
      position: relative;
    }

    button { margin-top:10px; }
  </style>
</head>
<body dir="rtl">

<h1>Tier List</h1>
<button onclick="resetAll()">רענן</button>

<h2>Pool</h2>
<div class="pool" data-tier="pool"></div>

<div class="tier">
  <div class="label" style="background: lightgreen;">אוהב</div>
  <div class="dropzone" data-tier="love"></div>
</div>

<div class="tier">
  <div class="label" style="background: khaki;">לא אכפת לי גבוה</div>
  <div class="dropzone" data-tier="high"></div>
</div>

<div class="tier">
  <div class="label" style="background: orange;">לא אכפת לי נמוך</div>
  <div class="dropzone" data-tier="low"></div>
</div>

<div class="tier">
  <div class="label" style="background: lightcoral;">שונא</div>
  <div class="dropzone" data-tier="hate"></div>
</div>

<script>
let dragged = null;

// תמונות ברירת מחדל
const defaultImages = [
  "images/13.50.14.png",
  "images/13.50.29.png",
  "images/13.50.35.png",
  "images/13.50.40.png",
  "images/13.50.44.png",
  "images/13.50.48.png",
  "images/13.50.54.png",
  "images/13.51.03.png",
  "images/13.51.07.png",
  "images/13.51.11.png",
  "images/13.51.15.png",
  "images/13.51.19.png",
  "images/13.51.24.png",
  "images/13.51.28.png",
  "images/13.51.32.png",
  "images/13.51.36.png",
  "images/13.51.39.png",
  "images/13.51.43.png",
  "images/13.51.48.png",
  "images/13.51.53.png"
];

// טען את התמונות למאגר
function loadImages() {
  const pool = document.querySelector('[data-tier="pool"]');
  pool.innerHTML = ""; // נקה קודם
  defaultImages.forEach(src => {
    const el = createImage(src);
    pool.appendChild(el);
  });
}

// צור wrapper עם תמונה בלבד (ללא כפתור מחיקה)
function createImage(src) {
  const wrapper = document.createElement("div");
  wrapper.className = "img-wrapper";
  wrapper.draggable = true;

  const img = document.createElement("img");
  img.src = src;

  wrapper.appendChild(img);

  wrapper.ondragstart = () => dragged = wrapper;
  wrapper.ondragend = () => dragged = null;

  return wrapper;
}

// Drag + reorder
function setupZones() {
  document.querySelectorAll(".dropzone, .pool").forEach(zone => {
    zone.ondragover = (e) => {
      e.preventDefault();
      const afterElement = getDragAfterElement(zone, e.clientX);
      if (afterElement == null) {
        zone.appendChild(dragged);
      } else {
        zone.insertBefore(dragged, afterElement);
      }
    };
  });
}

function getDragAfterElement(container, x) {
  const elements = [...container.querySelectorAll(".img-wrapper:not(.dragging)")];
  return elements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

// רענון – מחזיר את כל התמונות למאגר
function resetAll() {
  document.querySelectorAll(".dropzone").forEach(z => z.innerHTML = "");
  loadImages();
}

setupZones();
loadImages();
</script>

</body>
</html>
